{% extends 'base.html' %}

{% block content %}
<div class="hero-wrapper" style="min-height: 80vh; background: linear-gradient(to bottom, rgba(5,5,8,0.7), var(--bg-primary)), url('{{ url_for('static', filename='images/header.png') }}') center/cover;">
  <div class="glass-panel" style="max-width: 400px; width: 100%; margin: 60px auto; padding: 40px;">
    <h2 class="section-title text-gradient" style="margin-bottom: 30px;">Create Account</h2>
    
    {% if error %}
    <p style="color: var(--accent-pink); text-align: center; margin-bottom: 20px;">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('register') }}" method="post" style="display: flex; flex-direction: column; gap: 20px;">
        <input type="text" name="username" placeholder="Username" required style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); color: white; outline: none;">
        <input type="email" name="email" placeholder="Email" required style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); color: white; outline: none;">
        <input type="password" name="password" placeholder="Password" required style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); color: white; outline: none;">
        
        <button type="submit" class="btn-glowing btn-primary" style="margin-top: 10px;">Register</button>
    </form>
    
    <p style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('login') }}" style="color: var(--accent-cyan); text-decoration: none;">Already have an account? Login</a>
    </p>
  </div>
</div>
{% endblock %}
