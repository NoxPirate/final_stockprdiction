{% extends 'base.html' %}

{% block content %}
<div class="hero-wrapper" style="min-height: 80vh; background: linear-gradient(to bottom, rgba(5,5,8,0.7), var(--bg-primary)), url('{{ url_for('static', filename='images/header.png') }}') center/cover;">
  <h1 class="hero-title">Financial <span class="text-gradient">Calculators</span></h1>
  <p class="hero-subtitle">Plan your future with precision using our advanced EMI and SIP calculators.</p>

  <div class="dashboard-grid" style="max-width: 1000px; margin-top: 40px; gap: 40px;">
    
    <!-- SIP Form -->
    <div class="glass-panel" style="padding: 40px; text-align: center;">
      <h2 class="section-title text-gradient" style="font-size: 2rem; margin-bottom: 20px;">SIP Calculator</h2>
      
      <div style="display: flex; flex-direction: column; gap: 15px; text-align: left;">
        <label for="monthlyAmount" style="color: var(--text-muted);">Monthly SIP Amount (INR)</label>
        <input type="number" id="monthlyAmount" placeholder="Enter amount" min="1" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); color: white; outline: none;">
        
        <label for="returns" style="color: var(--text-muted);">Expected Returns (%)</label>
        <input type="number" id="returns" placeholder="Enter returns" min="1" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); color: white; outline: none;">
        
        <label for="investmentPeriod" style="color: var(--text-muted);">Investment Period (Years)</label>
        <input type="number" id="investmentPeriod" placeholder="Enter period" min="1" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); color: white; outline: none;">
        
        <button class="btn-glowing btn-primary" onclick="calculateSIP()" style="width: 100%; margin-top: 10px;">Calculate SIP</button>
        <p id="sipResult" style="margin-top: 20px; font-size: 1.2rem; font-weight: bold; color: var(--accent-cyan); text-align: center;"></p>
      </div>
    </div>

    <!-- EMI Form -->
    <div class="glass-panel" style="padding: 40px; text-align: center;">
      <h2 class="section-title text-gradient" style="font-size: 2rem; margin-bottom: 20px;">EMI Calculator</h2>
      
      <div style="display: flex; flex-direction: column; gap: 15px; text-align: left;">
        <label for="loanAmount" style="color: var(--text-muted);">Loan Amount (INR)</label>
        <input type="number" id="loanAmount" placeholder="Enter amount" min="1" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); color: white; outline: none;">
        
        <label for="interestRate" style="color: var(--text-muted);">Rate of Interest (%)</label>
        <input type="number" id="interestRate" placeholder="Enter interest rate" min="1" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); color: white; outline: none;">
        
        <label for="loanPeriod" style="color: var(--text-muted);">Loan Period (Years)</label>
        <input type="number" id="loanPeriod" placeholder="Enter period" min="1" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); color: white; outline: none;">
        
        <button class="btn-glowing btn-primary" onclick="calculateEMI()" style="width: 100%; margin-top: 10px;">Calculate EMI</button>
        <p id="emiResult" style="margin-top: 20px; font-size: 1.2rem; font-weight: bold; color: var(--accent-cyan); text-align: center;"></p>
      </div>
    </div>

  </div>
</div>

<script>
  function calculateSIP() {
    var monthlyAmount = parseFloat(document.getElementById('monthlyAmount').value);
    var returns = parseFloat(document.getElementById('returns').value);
    var investmentPeriod = parseFloat(document.getElementById('investmentPeriod').value);

    if (!isNaN(monthlyAmount) && !isNaN(returns) && !isNaN(investmentPeriod) && monthlyAmount > 0 && returns > 0 && investmentPeriod > 0) {
      var totalAmount = 0;
      var monthlyInterestRate = (returns / 100) / 12;
      var totalMonths = investmentPeriod * 12;

      for (var i = 0; i < totalMonths; i++) {
        totalAmount = (totalAmount + monthlyAmount) * (1 + monthlyInterestRate);
      }

      document.getElementById('sipResult').innerText = "Total Value: ₹" + totalAmount.toFixed(2);
    } else {
      document.getElementById('sipResult').innerText = "Please enter valid numbers.";
    }
  }

  function calculateEMI() {
    var loanAmount = parseFloat(document.getElementById('loanAmount').value);
    var interestRate = parseFloat(document.getElementById('interestRate').value);
    var loanPeriod = parseFloat(document.getElementById('loanPeriod').value);

    if (!isNaN(loanAmount) && !isNaN(interestRate) && !isNaN(loanPeriod) && loanAmount > 0 && interestRate > 0 && loanPeriod > 0) {
      var emi;
      var monthlyInterestRate = (interestRate / 100) / 12;
      var totalMonths = loanPeriod * 12;

      emi = (loanAmount * monthlyInterestRate * Math.pow((1 + monthlyInterestRate), totalMonths)) / (Math.pow((1 + monthlyInterestRate), totalMonths) - 1);

      document.getElementById('emiResult').innerText = "Monthly EMI: ₹" + emi.toFixed(2);
    } else {
      document.getElementById('emiResult').innerText = "Please enter valid numbers.";
    }
  }
</script>
{% endblock %}
